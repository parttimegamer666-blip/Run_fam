<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BF800" />
      <stop offset="50%" stop-color="#72D600" />
      <stop offset="100%" stop-color="#4EAB00" />
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BF800" />
      <stop offset="100%" stop-color="#67C600" />
    </linearGradient>
  </defs>

  <!-- Runner Icon -->
  <g transform="translate(140, 60)">
    <!-- Head -->
    <circle cx="150" cy="50" r="28" fill="url(#limeGrad)" />
    
    <!-- Forward Arm / Hand Accent -->
    <path d="M 172 106 C 185 106 205 118 205 125 C 205 132 186 142 172 142 Z" fill="url(#limeGrad)" />

    <!-- Upper Body & Loop (Abstract R / Runner Torso) -->
    <path d="M 40 76 
             L 115 76 
             C 142 76 168 96 168 126 
             C 168 152 144 172 118 172 
             L 94 172 
             C 86 172 82 178 86 186 
             L 106 186 
             C 140 186 178 154 178 120 
             C 178 78 138 52 98 52 
             L 30 52 
             C 14 52 24 76 40 76 Z" 
          fill="url(#limeGrad)" />

    <!-- Main Dynamic Forward Stride Body Slash (R Stem / Forward Leg) -->
    <path d="M 94 88 
             L 4 218 
             C -6 232 8 244 26 244 
             L 44 244 
             L 128 116 
             Z" 
          fill="url(#limeGrad)" />

    <!-- Rear Leg (Bent Running Knee) -->
    <path d="M 94 176 
             C 84 176 80 184 88 194 
             L 118 226 
             C 126 236 122 246 104 254 
             L 82 254 
             C 106 264 136 250 144 232 
             L 122 198 
             C 114 186 108 176 94 176 Z" 
          fill="url(#limeGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(250, 395)" text-anchor="middle">
    <text font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="78" font-style="italic" letter-spacing="-2">
      <tspan fill="#0F172A">Run</tspan><tspan fill="#72D600" dx="4">Fam</tspan>
    </text>
    <text y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="11" fill="#0F172A">
      MOVE TOGETHER
    </text>
  </g>
</svg>
